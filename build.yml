name: Androidアプリを作る

on:
  push:
    branches: [main]
    paths: ['android.zip', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: android.zip を解凍
        run: |
          rm -rf build-src && mkdir build-src
          unzip -q android.zip -d build-src
          ls -R build-src | head -40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APKを組み立てる
        working-directory: build-src/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: ダウンロードできるように公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build-src/android/app/build/outputs/apk/debug/app-debug.apk SyncCamGame.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SyncCamGame.apk --title "SyncCam Game（最新版）" --notes "ビルド番号 ${{ github.run_number }}"
