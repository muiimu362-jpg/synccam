name: Androidアプリを作る

on:
  push:
    branches: [main]
    paths: ['**.zip', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: いちばん新しいzipを解凍（名前が android (1).zip などでもOK）
        run: |
          Z="$(git log -1 --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -1)"
          if [ -z "$Z" ] || [ ! -f "$Z" ]; then Z="$(ls -1 *.zip | head -1)"; fi
          echo "使うファイル: $Z"
          rm -rf build-src && mkdir build-src
          unzip -q "$Z" -d build-src
          ls build-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APKを組み立てる
        working-directory: build-src/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: ダウンロードできるように公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build-src/android/app/build/outputs/apk/debug/app-debug.apk SyncCamGame.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SyncCamGame.apk --title "SyncCam Game（最新版）" --notes "ビルド番号 ${{ github.run_number }}"
